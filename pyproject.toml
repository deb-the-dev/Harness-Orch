[project]
name = "harness"
version = "0.1.0"
description = "Agent control harness, step-aware model routing layer, and FDE enterprise orchestration plane"
requires-python = ">=3.12"
dependencies = [
    "aiohttp",
    "fastapi>=0.110.0",
    "litellm",
    "psycopg[binary]",
    "psycopg_pool",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27.0", "pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
