# Standard Kubernetes NetworkPolicy. Enforced only if the cluster's network plugin implements it.
# 1. agents: deny all egress, then allow only the router on 8080 and cluster DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: agents-egress-router-only, namespace: agents}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {spike4: router}}
          podSelector: {matchLabels: {app: router}}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# 2. external (provider side): accept traffic only from the router namespace (defence in depth).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: provider-ingress-router-only, namespace: external}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {spike4: router}}
      ports: [{protocol: TCP, port: 8080}]
